[workspace]
members = ["crates/service-core", "crates/peerstream-service"]
resolver = "2"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "=1.18.1", features = ["v4"] }
[profile.release]
lto = true
strip = true
